{% extends "base.html" %}

{% block title %}{{ post.title }} - {{ site.title }}{% endblock %}

{% block content %}
<article class="post">
  <h1 class="post-title">{{ post.title }}</h1>
  <p class="post-meta">发布于 {{ post.date|dateformat if post.date else '未知日期' }}</p>
  {% if post.toc %}
  <nav class="post-toc">{{ post.toc|safe }}</nav>
  {% endif %}
  <div class="post-content">
    {{ post.html|safe }}
  </div>
</article>
{% endblock %}
