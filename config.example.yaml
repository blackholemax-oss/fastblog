# StaticGen 示例配置（入库模板，请勿直接修改）
#
# 使用方式：复制本文件为 config.yaml 后按需修改：
#   cp config.example.yaml config.yaml
#
# config.yaml 是用户本地配置，已被 .gitignore 排除、不会提交到仓库，
# 可安全存放 deploy.remote_url 等私有信息。所有路径均相对于项目根目录。

site:
  title: "我的静态博客"
  description: "由 StaticGen 驱动的静态博客"
  author: "Anonymous"
  language: "zh-CN"

build:
  content_dir: "content"   # Markdown 内容根目录
  output_dir: "output"     # 生成产物目录（每次 build 自动清空）
  theme: "default"         # 使用的主题名（对应 themes/<name>/）

serve:
  host: "127.0.0.1"
  port: 8000
  open_browser: true

deploy:
  enabled: false           # 设为 true 时每次 build 后自动推送
  remote: "origin"
  remote_url: ""           # 远程仓库地址（HTTPS/SSH），deploy 命令必填
  branch: "gh-pages"       # 推送目标分支（main 或 gh-pages）
  auto_actions: true       # 自动生成 .github/workflows 模板