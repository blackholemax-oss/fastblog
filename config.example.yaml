# fastblog 示例配置（入库模板，请勿直接修改）
#
# 使用方式：复制本文件为 config.yaml 后按需修改：
#   cp config.example.yaml config.yaml
#
# config.yaml 是用户本地配置，已被 .gitignore 排除、不会提交到仓库，
# 可安全存放 deploy.remote_url 等私有信息。所有路径均相对于项目根目录。

site:
  title: "BlackHoleMax的开发日志"
  description: "由 fastblog 驱动的静态博客"
  author: "blackholemax-oss"
  language: "zh-CN"

build:
  content_dir: "content"   # Markdown 内容根目录
  output_dir: "output"     # 生成产物目录（每次 build 自动清空）
  theme: "default"         # 使用的主题名（对应 themes/<name>/）

serve:
  host: "127.0.0.1"
  port: 8000
  open_browser: true

deploy:
  enabled: false           # 设为 true 时每次 build 后自动推送
  remote: "github-io"      # 产物仓库的远程名
  remote_url: ""           # 远程仓库地址（HTTPS/SSH），远程不存在时必填
  branch: "main"           # 推送目标分支（配合 GitHub Actions 自动发布）